# Example configuration for teamdb service
# Copy this file to `server_config.yml` and update values before starting the service.

# Host and port to bind the service to
host: 127.0.0.1
port: 8765

# Root directory for application data (database, backups, token store)
# Use an absolute path or a path relative to the repository root
# If you start the server from outside the `server` directory, specify the full path:
# data_root: <path-to-repo-root>/data
# data_root: ../data

# How many backups to keep when the DB is overwritten
# max_backups: 10

# CORS allowed origins. Recommended options:
# - For development on the same machine: ['http://127.0.0.1', 'http://localhost']
# - For a specific origin: ['https://app.example.com']
# - Do NOT use '*' in production. If '*' is set, credentials will be disabled for safety.
#allow_origins: ['http://127.0.0.1', 'http://localhost']
allow_origins: ['chrome-extension://nkhmibakbofnndfkojldebgpfnmmkphn']

# Enables server-hosted UI endpoints (/ui and /portal/*).
ui_enabled: false

# Enables external consultant account + absence APIs.
external_portal_enabled: true

# Session cookie security for hosted deployments (set true behind HTTPS).
cookie_secure: false

# Admin UI session lifetime (hours).
admin_session_hours: 12

# External user session lifetime (hours).
external_session_hours: 12

# Required for encrypted external APIs and SuccessFactors payload storage. Generate with:
# python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
# external_encryption_key: "REPLACE_WITH_32_BYTE_BASE64URL_FERNET_KEY"
